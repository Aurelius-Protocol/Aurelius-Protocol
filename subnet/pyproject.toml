[project]
name = "subnet"
version = "0.1.0"
description = "Aurelius v5 miner, authenticated serving and SAE submission tools"
requires-python = ">=3.11,<3.13"
dependencies = [
    "py-sr25519-bindings>=0.2,<0.3",
    "base58>=2.1,<3",
    "cryptography>=50.0.1,<51",
    "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
# Match the tested v5 SDK CLI closure; newer Typer removed its Exit compatibility symbol.
bt = ["bittensor==11.0.0", "typer==0.26.8"]

[project.scripts]
aurelius-miner = "subnet.miner.cli:main"
aurelius-sae = "subnet.lanes.interp_sae.miner_cli:main"
aurelius-sae-stage = "subnet.lanes.interp_sae.stage:main"
aurelius-sae-upload = "subnet.lanes.interp_sae.upload:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subnet"]
