name: CI

on:
  push:
    branches: [main, testnet]
    # Publish versioned images on semver tags (e.g. `v1.2.3`). Third-party
    # operators pin to these tags instead of `:latest` so a bad push to
    # `main` can't reach them automatically. See `docker-compose.validator.yml`
    # and VALIDATOR_SETUP.md §Upgrades.
    tags: ["v*.*.*"]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main, testnet]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  schedule:
    # Weekly canary: resolve-check runs a fresh, unconstrained dependency
    # resolution, so upstream bittensor-ecosystem drift is caught between
    # PRs instead of on a validator rebuild.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check aurelius/
      - run: ruff format --check aurelius/

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Constrained by the lock so CI tests the same pinned stack the
      # published image ships; dev-only tools float within pyproject ranges.
      - run: pip install -c requirements.lock -e ".[ml,simulation,dev]"
      - run: pytest tests/ --ignore=tests/e2e --ignore=tests/common/test_embeddings.py -x --tb=short

  resolve-check:
    # Proves a fresh, unconstrained resolution of the Docker extras still
    # installs and imports — the failure mode that broke validator installs
    # when the bittensor 10.x ecosystem moved underneath us (chain runtime
    # v432 / async-substrate-interface 2.x / cyscale). If this job fails and
    # `test` passes, upstream drifted: fix pyproject bounds and/or regenerate
    # requirements.lock.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ".[ml,simulation,llm]"
      - run: |
          python - <<'EOF'
          import inspect

          import bittensor as bt

          assert "mechid" in inspect.signature(bt.set_weights).parameters
          for name in ("http_auth", "ServeAxon", "Client"):
              assert hasattr(bt, name), f"bittensor 11 API missing {name}"

          # Golden vector from tests/common/test_multisig.py: proves
          # bt.sp_core's ss58 codec still produces byte-identical
          # multisig derivation.
          from aurelius.common.multisig import derive_multisig_address

          assert derive_multisig_address(
              [
                  "5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY",
                  "5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty",
                  "5FLSigC9HGRKVhB9FiEo4Y3koPsNmBmLJbpXg2mp1hXcS59Y",
              ],
              2,
          ) == "5DYHJokMqSGX6fNy7EpZVeZvJUZedpVUvizur6EqeespKtxz"

          import aurelius.miner.miner  # noqa: F401
          import aurelius.protocol  # noqa: F401
          import aurelius.transport  # noqa: F401
          import aurelius.validator.validator  # noqa: F401

          print("resolve-check OK: bittensor", bt.__version__)
          EOF
      - run: pip check

  docker-build:
    # Build a single image and publish it under both aurelius-validator and
    # aurelius-miner package names. The images are byte-identical — only the
    # runtime command differs, which is now driven by AURELIUS_CMD in each
    # operator's .env (set to aurelius-validator or aurelius-miner by
    # deploy.sh). Building once instead of twice halves CI compute and
    # wall-clock for the docker-build job.
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/testnet' ||
       startsWith(github.ref, 'refs/tags/v'))
    needs: [lint, docker-build-concordia]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free runner disk space
        # The ubuntu-latest runner ships ~14 GB free; our image exceeds that
        # with ML + sim extras, causing "No space left on device" mid-build.
        # This action frees ~30 GB by removing preinstalled toolchains we
        # don't use (dotnet, android, haskell, tool-cache, swap).
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Lowercase owner for GHCR
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # Same tag set applied to two image names; docker/metadata-action
          # produces tags on each.
          images: |
            ghcr.io/${{ steps.repo.outputs.owner }}/aurelius-validator
            ghcr.io/${{ steps.repo.outputs.owner }}/aurelius-miner
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile.node
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CONCORDIA_IMAGE_DIGEST=${{ needs.docker-build-concordia.outputs.concordia_digest }}

  docker-build-concordia:
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/testnet' ||
       startsWith(github.ref, 'refs/tags/v'))
    needs: [lint]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    outputs:
      concordia_digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Lowercase owner for GHCR
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/aurelius-concordia
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: useblacksmith/build-push-action@v2
        id: build-push
        with:
          context: aurelius/simulation/
          file: aurelius/simulation/Dockerfile.concordia
          push: true
          # Disable attestations — the legacy v3 repo's prior pushes left
          # provenance blobs in aurelius-concordia whose HEAD-checks our
          # token can't satisfy, causing 403 on every re-push. Supply-chain
          # guarantee is provided by the digest exported from this job's
          # outputs and baked into the validator/miner image via build-arg.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
