[project]
name = "aurelius-miner-workspace"
version = "0.1.0"
description = "Aurelius v5 miner participant tools"
requires-python = ">=3.11,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["subnet"]

[dependency-groups]
dev = ["subnet[bt]", "pytest==9.1.1", "ruff>=0.6,<1", "import-linter>=2.1,<3"]

[tool.uv.sources]
subnet = { workspace = true }

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["subnet/tests"]
markers = ["miner: miner participant behavior", "shared: shared protocol behavior"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
